<!DOCTYPE html>
<html>
<body>

<input id="colorInput" value="#F71833" oninput="generate()">

<div>
<div>Base <span id="base"></span> <button onclick="copy('base')">Copy</button></div>
<div>Highlight <span id="highlight"></span> <button onclick="copy('highlight')">Copy</button></div>
<div>Shadow <span id="shadow"></span> <button onclick="copy('shadow')">Copy</button></div>
<div>Outline <span id="outline"></span> <button onclick="copy('outline')">Copy</button></div>
</div>

<script>
function hexToRgb(hex){
hex=hex.replace("#","")
return [
parseInt(hex.substring(0,2),16)/255,
parseInt(hex.substring(2,4),16)/255,
parseInt(hex.substring(4,6),16)/255
]
}

function rgbToHex(rgb){
return "#"+
Math.round(rgb[0]*255).toString(16).padStart(2,"0").toUpperCase()+
Math.round(rgb[1]*255).toString(16).padStart(2,"0").toUpperCase()+
Math.round(rgb[2]*255).toString(16).padStart(2,"0").toUpperCase()
}

function rgbToHsv(r,g,b){
let max=Math.max(r,g,b),min=Math.min(r,g,b)
let h,s,v=max
let d=max-min
s=max===0?0:d/max
if(max===min) h=0
else{
switch(max){
case r:h=(g-b)/d+(g<b?6:0);break
case g:h=(b-r)/d+2;break
case b:h=(r-g)/d+4;break
}
h/=6
}
return [h,s,v]
}

function hsvToRgb(h,s,v){
let r,g,b
let i=Math.floor(h*6)
let f=h*6-i
let p=v*(1-s)
let q=v*(1-f*s)
let t=v*(1-(1-f)*s)
switch(i%6){
case 0:r=v,g=t,b=p;break
case 1:r=q,g=v,b=p;break
case 2:r=p,g=v,b=t;break
case 3:r=p,g=q,b=v;break
case 4:r=t,g=p,b=v;break
case 5:r=v,g=p,b=q;break
}
return [r,g,b]
}

function adjustHSV(rgb,hShift,sMult,vMult){
let hsv=rgbToHsv(rgb[0],rgb[1],rgb[2])
let h=(hsv[0]+hShift)%1
let s=Math.min(1,Math.max(0,hsv[1]*sMult))
let v=Math.min(1,Math.max(0,hsv[2]*vMult))
return hsvToRgb(h,s,v)
}

function setColor(id,color){
let el=document.getElementById(id)
el.textContent=color
el.style.background=color
}

function generate(){
let hex=document.getElementById("colorInput").value
if(!hex.startsWith("#")) hex="#"+hex
let base=hexToRgb(hex)

let highlight=adjustHSV(base,0.02,0.85,1.25)
let shadow=adjustHSV(base,-0.02,1.2,0.7)
let outline=adjustHSV(shadow,-0.01,1.2,0.6)

setColor("base",rgbToHex(base))
setColor("highlight",rgbToHex(highlight))
setColor("shadow",rgbToHex(shadow))
setColor("outline",rgbToHex(outline))
}

function copy(id){
let text=document.getElementById(id).textContent
navigator.clipboard.writeText(text)
}

generate()
</script>

</body>
</html>
